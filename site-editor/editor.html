<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",Verdana,Arial,sans-serif;background:#f0f2f5;color:#26282e;font-size:14px}
header.top{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;padding:10px 22px;flex-wrap:wrap;gap:8px}
.brand{font-size:17px;font-weight:bold;color:#1a3c6e}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #c9d2de;background:#fff;color:#2b4a72;border-radius:6px;padding:5px 12px;font-size:13px;font-family:inherit;transition:all .15s}
button:hover{background:#eef4fb;border-color:#8fb1d9}
button.primary{background:#1a5dad;border-color:#1a5dad;color:#fff}
button.primary:hover{background:#174f95}
button.danger{color:#c0392b;border-color:#e0b4b0}
button.danger:hover{background:#fdecea}
button.mini{padding:2px 8px;font-size:12px}
#saveStatus{font-size:12px;color:#888;min-width:110px}
#mode{font-size:12px;padding:2px 8px;border-radius:10px;background:#e6f4ea;color:#1e7e34}
#mode.local{background:#fff3df;color:#a4700a}
nav.tabs{display:flex;gap:4px;max-width:1120px;margin:16px auto 0;padding:0 20px;flex-wrap:wrap}
nav.tabs button{border-radius:8px 8px 0 0;border-bottom:none;padding:9px 18px;font-size:14px;background:#e6e9ee;color:#556}
nav.tabs button.active{background:#fff;color:#1a5dad;font-weight:bold}
main{max-width:1120px;margin:0 auto 60px;padding:0 20px}
.panel{background:#fff;border-radius:0 10px 10px 10px;box-shadow:0 1px 5px rgba(0,0,0,.07);padding:26px 30px;min-height:420px}
h2.sec{font-size:17px;color:#1a3c6e;margin:22px 0 10px;padding-left:10px;border-left:4px solid #1a5dad}
h2.sec:first-child{margin-top:0}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:#667;margin-bottom:4px}
.field input[type=text],.field input[type=url],.field input[type=number],.field textarea,.field select{width:100%;padding:7px 10px;border:1px solid #ccd4de;border-radius:6px;font-size:13px;font-family:inherit;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.rte{border:1px solid #ccd4de;border-radius:6px;min-height:120px;padding:10px 12px;background:#fff;line-height:1.7;font-family:Georgia,"Times New Roman",serif;overflow:auto}
.rte:focus{outline:2px solid #9cc3ee}
.rte a{color:#1a5dad}
.toolbar{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.toolbar button{padding:2px 10px;font-size:12px}
.list-row{display:flex;align-items:flex-start;gap:10px;border:1px solid #e6eaf0;border-radius:8px;padding:10px 14px;margin:8px 0;background:#fbfcfe}
.list-row:hover{border-color:#b9cbe4}
.list-row.featured{border-left:3px solid #e8c84a;background:#fffdf3}
button.star-on{background:#fff3cf;border-color:#e0c245;color:#8a6d00}
.list-row .grow{flex:1;min-width:0}
.list-row .ttl{font-weight:bold;color:#1a5dad;word-break:break-word}
.list-row .sub{font-size:12.5px;color:#667;margin-top:3px}
.list-row .ops{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mcard{border:1px solid #e3e8ef;border-radius:10px;padding:14px;background:#fbfcfe}
.mcard .photobox{text-align:center}
.mcard img{width:96px;height:120px;object-fit:cover;border-radius:8px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.15)}
.mcard .nop{width:96px;height:120px;border-radius:8px;background:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;color:#889;font-size:12px;cursor:pointer}
.mcard .ops{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;background:#e8f0fb;color:#1a5dad;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.quick{display:grid;grid-template-columns:130px 2fr 2fr 100px auto;gap:8px;align-items:end;background:#f7f9fc;border:1px dashed #c9d2de;padding:12px;border-radius:8px;margin-bottom:16px}
.quick input,.quick select{padding:6px 8px;border:1px solid #ccd4de;border-radius:6px;font-size:13px;width:100%}
.mask{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:22px 26px;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.modal h3{margin-bottom:14px;color:#1a3c6e}
.modal .mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#2b3a55;color:#fff;padding:9px 22px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:80vw}
#toast.show{opacity:.95}
.hint{font-size:12.5px;color:#889;background:#f6f8fb;border-radius:6px;padding:8px 12px;margin:8px 0;line-height:1.7}
.hint b{color:#1a5dad}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#444;margin-top:6px}
.yearhead{font-size:15px;font-weight:bold;color:#333;margin:16px 0 4px;font-family:Verdana,sans-serif}
.exp{font-size:12px;color:#889}
.filelist{font-size:12.5px;color:#556;background:#f7f9fc;border-radius:6px;padding:10px 14px;margin-top:10px;max-height:200px;overflow:auto;font-family:Consolas,monospace}
.kv{margin:10px 0}
.kv b{color:#1a3c6e}
</style>

<script>
'use strict';
let D = null, MODE = 'server', saveTimer = null, curTab = 'profile';

/* ---------- 数据载入 / 保存 ---------- */
async function load() {
  const fallback = JSON.parse(document.getElementById('default-data').textContent);
  try {
    const r = await fetch('/api/data');
    if (!r.ok) throw 0;
    const j = await r.json();
    if (!j || !j.profile) throw 0;
    D = j; MODE = 'server';
  } catch (e) {
    MODE = 'local';
    const s = localStorage.getItem('labSiteData');
    D = s ? JSON.parse(s) : JSON.parse(JSON.stringify(fallback));
    if (!D.profile) D = JSON.parse(JSON.stringify(fallback));
  }
  const m = document.getElementById('mode');
  m.textContent = MODE === 'server' ? '● 已连接本地服务' : '● 浏览器本地模式';
  m.className = MODE === 'server' ? '' : 'local';
}
function save() {
  document.getElementById('saveStatus').textContent = '保存中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}
async function doSave() {
  const j = JSON.stringify(D);
  if (MODE === 'server') {
    try {
      const r = await fetch('/api/data', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: j });
      if (!r.ok) throw 0;
      document.getElementById('saveStatus').textContent = '已保存 ✓';
      return;
    } catch (e) { MODE = 'local'; }
  }
  localStorage.setItem('labSiteData', j);
  document.getElementById('saveStatus').textContent = '已保存(浏览器) ✓';
}
function esc(s) { return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function uid() { return 'm' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

/* ---------- Tab 切换 ---------- */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curTab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  ['profile','members','pubs','honors','codes','publish'].forEach(t =>
    document.getElementById('tab-' + t).style.display = t === curTab ? '' : 'none');
  renderAll();
});
function renderAll() {
  renderProfile(); renderMembers(); renderPubs(); renderHonors(); renderCodes(); renderPublish();
}

/* ---------- 文件选择 ---------- */
function pickFile(accept, cb) {
  const inp = document.getElementById('fileInput');
  inp.value = ''; inp.accept = accept;
  inp.onchange = () => { if (inp.files[0]) cb(inp.files[0]); };
  inp.click();
}
function fileB64(file) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(file); });
}
async function uploadPhoto(file) {
  if (MODE === 'server') {
    const r = await fetch('/api/photo', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: file.name, b64: await fileB64(file) }) });
    const j = await r.json();
    if (j.ok) return j.path;
    throw new Error(j.error || '上传失败');
  }
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
}
async function wordToHtml(file) {
  if (MODE === 'server') {
    const r = await fetch('/api/word2html', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: file.name, b64: await fileB64(file) }) });
    const j = await r.json();
    if (j.ok) return j.html;
    throw new Error(j.error || '解析失败');
  }
  // 浏览器本地模式：尝试 CDN mammoth
  try {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
      setTimeout(rej, 8000);
    });
    const arrayBuffer = await file.arrayBuffer();
    const result = await window.mammoth.convertToHtml({ arrayBuffer });
    return result.value;
  } catch (e) {
    throw new Error('浏览器本地模式无法解析 Word，请双击「启动编辑器.bat」后使用');
  }
}

/* ---------- 通用富文本工具条 ---------- */
function rteToolbar(id) {
  return `<div class="toolbar">
    <button type="button" onmousedown="event.preventDefault()" onclick="fmt('${id}','bold')"><b>B</b></button>
    <button type="button" onmousedown="event.preventDefault()" onclick="fmt('${id}','italic')"><i>I</i></button>
    <button type="button" onmousedown="event.preventDefault()" onclick="fmt('${id}','underline')"><u>U</u></button>
    <button type="button" onclick="addLink('${id}')">🔗 链接</button>
    <button type="button" onmousedown="event.preventDefault()" onclick="fmt('${id}','removeFormat')">清除格式</button>
  </div>`;
}
function fmt(id, cmd) { document.execCommand(cmd, false, null); document.getElementById(id).focus(); }
function addLink(id) {
  const url = prompt('请粘贴链接 URL：');
  if (url) document.execCommand('createLink', false, url);
  document.getElementById(id).focus();
}

/* ================= 个人信息 ================= */
function renderProfile() {
  const p = D.profile;
  const eduRows = (p.education || []).map((e, i) => `
    <div class="list-row">
      <div class="grow">
        <div class="row3">
          <div class="field"><label>学位 / 阶段</label><input type="text" value="${esc(e.degree)}" oninput="D.profile.education[${i}].degree=this.value;save()"></div>
          <div class="field"><label>时间</label><input type="text" value="${esc(e.period)}" oninput="D.profile.education[${i}].period=this.value;save()"></div>
          <div class="field"><label>单位地点</label><input type="text" value="${esc(e.place)}" oninput="D.profile.education[${i}].place=this.value;save()"></div>
        </div>
        <div class="row2">
          <div class="field"><label>导师姓名（可留空）</label><input type="text" value="${esc(e.sup)}" oninput="D.profile.education[${i}].sup=this.value;save()"></div>

function addEdu() { D.profile.education = D.profile.education || []; D.profile.education.push({ degree: '', period: '', place: '', sup: '', supUrl: '' }); save(); renderProfile(); }
function delEdu(i) { if (!confirm('删除这条教育经历？')) return; D.profile.education.splice(i, 1); save(); renderProfile(); }
function moveEdu(i, d) { const a = D.profile.education, j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(); renderProfile(); }
async function changeAvatar() {
  pickFile('image/*', async f => {
    try { D.profile.avatar = await uploadPhoto(f); save(); renderProfile(); toast('头像已更新'); }

}

/* ================= 团队成员 ================= */
function memberCard(m, group, i) {
  const isCur = group === 'current';
  const photo = m.photo
    ? `<img src="${esc(m.photo)}" title="点击更换照片" onclick="changePhoto('${group}',${i})">`
    : `<div class="nop" onclick="changePhoto('${group}',${i})">上传照片</div>`;
  const info = isCur
    ? `<div class="row2">
        <div class="field"><label>学位</label><input type="text" value="${esc(m.degree)}" oninput="D.members.${group}[${i}].degree=this.value;save()"></div>
        <div class="field"><label>年级 / 入学年份</label><input type="text" value="${esc(m.year)}" oninput="D.members.${group}[${i}].year=this.value;save()"></div>
      </div>`
    : `<div class="row2">
        <div class="field"><label>学位</label><input type="text" value="${esc(m.degree)}" oninput="D.members.${group}[${i}].degree=this.value;save()"></div>
        <div class="field"><label>在读时间</label><input type="text" value="${esc(m.period)}" oninput="D.members.${group}[${i}].period=this.value;save()"></div>
      </div>
      <div class="field"><label>毕业去向</label><input type="text" value="${esc(m.now)}" oninput="D.members.${group}[${i}].now=this.value;save()"></div>`;
  const enabled = m.homepageEnabled && (m.homepageHtml || '').trim();
  return `
  <div class="mcard">
    <div class="photobox">${photo}</div>
    <div class="field" style="margin-top:8px"><label>姓名</label><input type="text" value="${esc(m.name)}" oninput="D.members.${group}[${i}].name=this.value;save()"></div>
    ${info}
    <div class="field"><label>外部个人主页链接（有则优先显示）</label><input type="text" placeholder="https://..." value="${esc(m.link)}" oninput="D.members.${group}[${i}].link=this.value;save()"></div>
    <div class="chk"><input type="checkbox" ${m.homepageEnabled ? 'checked' : ''} onchange="D.members.${group}[${i}].homepageEnabled=this.checked;save();renderMembers()"> 启用独立个人主页</div>
    ${m.homepageEnabled ? `
      <div class="ops">
        <button class="mini primary" onclick="uploadWord('${group}',${i})">📄 上传Word生成主页</button>
        <button class="mini" onclick="editHome('${group}',${i})">✏️ 编辑主页内容</button>
        ${MODE === 'server' ? `<button class="mini" onclick="previewHome('${group}',${i})">👁 预览</button>` : ''}
      </div>
      <div class="exp" style="margin-top:6px">${enabled ? '✅ 主页内容已就绪，导出网站后将生成 members/' + slug(m.name) + '.html' : '⚠️ 还没有主页内容：可上传 Word 或手动编辑'}</div>` : ''}
    <div class="ops">
      <button class="mini" onclick="moveMember('${group}',${i},-1)">↑</button>
      <button class="mini" onclick="moveMember('${group}',${i},1)">↓</button>
      <button class="mini danger" onclick="delMember('${group}',${i})">删除</button>
    </div>
  </div>`;
}
function slug(name) { const s = (name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); return s || 'member'; }
function renderMembers() {
  const cur = (D.members.current || []).map((m, i) => memberCard(m, 'current', i)).join('');
  const alm = (D.members.alumni || []).map((m, i) => memberCard(m, 'alumni', i)).join('');
  document.getElementById('tab-members').innerHTML = `
    <h2 class="sec">在读成员 Group Members
      <button class="mini primary" style="margin-left:8px" onclick="addMember('current')">＋ 添加成员</button></h2>
    <div class="hint">每位成员都可以勾选「启用独立个人主页」：<b>上传 Word 文档即可自动生成其个人主页</b>（支持标题、加粗、列表、链接、图片），也可手动编辑内容。</div>
    <div class="mgrid">${cur || '<div class="hint">暂无成员</div>'}</div>
    <h2 class="sec">已毕业成员 Alumni
      <button class="mini primary" style="margin-left:8px" onclick="addMember('alumni')">＋ 添加成员</button></h2>
    <div class="mgrid">${alm || '<div class="hint">暂无成员</div>'}</div>`;
}
function addMember(group) {
  const m = { id: uid(), name: 'New Member', degree: 'Ph.D', year: String(new Date().getFullYear()), photo: '', link: '', homepageEnabled: false, homepageHtml: '', period: '', now: '' };
  D.members[group] = D.members[group] || []; D.members[group].unshift(m);
  save(); renderMembers(); toast('已添加，请编辑信息并上传照片');
}
function delMember(group, i) { if (!confirm('确定删除该成员？')) return; D.members[group].splice(i, 1); save(); renderMembers(); }
function moveMember(group, i, d) { const a = D.members[group], j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(); renderMembers(); }
function changePhoto(group, i) {
  pickFile('image/*', async f => {
    try { D.members[group][i].photo = await uploadPhoto(f); save(); renderMembers(); toast('照片已更新'); }
    catch (e) { toast(e.message); }
  });
}
async function uploadWord(group, i) {
  pickFile('.docx', async f => {
    toast('正在解析 Word…');
    try {
      const html = await wordToHtml(f);
      D.members[group][i].homepageHtml = html;
      D.members[group][i].homepageEnabled = true;
      await doSave(); renderMembers(); toast('✅ 已根据 Word 生成个人主页内容');
    } catch (e) { toast(e.message); }
  });
}
function editHome(group, i) {
  const m = D.members[group][i];
  openModal('编辑个人主页内容 — ' + m.name, `
    <div class="hint">可直接粘贴 HTML（从 Word「另存为网页」复制的代码也可以）。图片若使用上传功能会自动保存。</div>
    <div class="field"><textarea id="homeHtml" style="min-height:320px;font-family:Consolas,monospace;font-size:12.5px">${esc(m.homepageHtml)}</textarea></div>
  `, () => {
    m.homepageHtml = document.getElementById('homeHtml').value;
    m.homepageEnabled = true; save(); renderMembers(); toast('主页内容已保存');
  });
}
async function previewHome(group, i) {
  const m = D.members[group][i];
  if (!m.homepageEnabled || !(m.homepageHtml || '').trim()) { toast('请先生成主页内容'); return; }
  await doSave();
  try { await fetch('/api/export'); } catch (e) {}
  window.open('/site/members/' + slug(m.name) + '.html');
}

/* ================= 论文发表 ================= */
let pubFilter = 'all';
function pubRow(p, idx) {
  const tmap = { journal: '期刊', conf: '会议', patent: '专利' };
  const titleHtml = p.link ? `<a href="${esc(p.link)}" target="_blank" class="ttl">${esc(p.title)}</a>` : `<span class="ttl">${esc(p.title)}</span>`;
  let sub = esc(p.authors || '');
  if (p.type === 'journal') sub += ` · ${esc(p.venue)}, ${esc(p.meta)}, ${p.year || ''}`;
  else if (p.type === 'conf') sub += ` · ${esc(p.venue)}, ${esc(p.meta)}, ${p.year || ''}`;
  else sub += ` · ${esc(p.venue)}, ${esc(p.meta)}`;
  if (p.note) sub += ` · (${esc(p.note)})`;
  const featCls = p.featured ? ' featured' : '';
  const featBadge = p.featured ? `<span class="chip" style="background:#fff3cf;color:#9c7a00">⭐ 亮点展示${p.image ? ' · 已配图' : ''}</span>` : '';
  return `<div class="list-row${featCls}">
    <div class="grow">${titleHtml}<span class="chip">${tmap[p.type]}</span>${p.type === 'conf' && p.track ? `<span class="chip">${esc(p.track)}</span>` : ''}${featBadge}<div class="sub">${sub}</div></div>
    <div class="ops">
      <button class="mini ${p.featured ? 'star-on' : ''}" title="设为亮点展示" onclick="toggleFeatured('${p.id}')">⭐</button>
      <button class="mini" onclick="editPub('${p.id}')">编辑</button>
      <button class="mini" onclick="movePub(${idx},-1)">↑</button>
      <button class="mini" onclick="movePub(${idx},1)">↓</button>
      <button class="mini danger" onclick="delPub('${p.id}')">删除</button>
    </div></div>`;
}
function renderPubs() {
  const list = D.publications || [];
  let html = `<h2 class="sec">快速添加论文（粘贴链接）</h2>
  <div class="quick">
    <select id="qType"><option value="journal">期刊论文</option><option value="conf">会议论文</option><option value="patent">专利</option></select>
    <input id="qTitle" placeholder="论文标题（必填）">
    <input id="qLink" placeholder="粘贴论文链接 https://... （可选）">
    <input id="qYear" placeholder="年份" value="${new Date().getFullYear()}">
    <button class="primary" onclick="quickAddPub()">＋ 快速添加</button>
  </div>
  <div class="hint">添加后在下方列表点「编辑」完善作者、期刊、备注等信息。标注 * 共同一作、# 通讯作者请直接写在作者栏。</div>
  <h2 class="sec">论文列表
    <span style="margin-left:10px">
      <button class="mini ${pubFilter === 'all' ? 'primary' : ''}" onclick="setFilter('all')">全部 (${list.length})</button>
      <button class="mini ${pubFilter === 'journal' ? 'primary' : ''}" onclick="setFilter('journal')">期刊 (${list.filter(p => p.type === 'journal').length})</button>
      <button class="mini ${pubFilter === 'conf' ? 'primary' : ''}" onclick="setFilter('conf')">会议 (${list.filter(p => p.type === 'conf').length})</button>
      <button class="mini ${pubFilter === 'patent' ? 'primary' : ''}" onclick="setFilter('patent')">专利 (${list.filter(p => p.type === 'patent').length})</button>
      <button class="mini" onclick="editPub(null)">＋ 新建论文</button>
    </span></h2>`;
  const shown = list.map((p, idx) => ({ p, idx })).filter(x => pubFilter === 'all' || x.p.type === pubFilter);
  if (pubFilter === 'all' || pubFilter === 'journal') {
    const years = [...new Set(shown.filter(x => x.p.type === 'journal').map(x => x.p.year || 0))].sort((a, b) => b - a);
    for (const y of years) {
      html += `<div class="yearhead">${y ? y : '未分组'}（期刊）</div>`;
      html += shown.filter(x => x.p.type === 'journal' && (x.p.year || 0) === y).map(x => pubRow(x.p, x.idx)).join('');
    }
  }
  if (pubFilter === 'all' || pubFilter === 'conf') {
    html += `<div class="yearhead">会议论文</div>`;
    html += shown.filter(x => x.p.type === 'conf').map(x => pubRow(x.p, x.idx)).join('') || '<div class="hint">暂无</div>';
  }
  if (pubFilter === 'all' || pubFilter === 'patent') {
    html += `<div class="yearhead">授权专利</div>`;
    html += shown.filter(x => x.p.type === 'patent').map(x => pubRow(x.p, x.idx)).join('') || '<div class="hint">暂无</div>';
  }
  document.getElementById('tab-pubs').innerHTML = html;
}
function setFilter(f) { pubFilter = f; renderPubs(); }
function quickAddPub() {
  const type = document.getElementById('qType').value;
  const title = document.getElementById('qTitle').value.trim();
  const link = document.getElementById('qLink').value.trim();
  const year = parseInt(document.getElementById('qYear').value) || 0;
  if (!title) { toast('请填写论文标题'); return; }
  const p = { id: 'p' + Date.now().toString(36), type, authors: '', title, venue: '', meta: '', year, link, note: '' };
  if (type === 'conf') p.track = 'Artificial Intelligence';
  D.publications.unshift(p); save(); renderPubs(); toast('已添加，可点击「编辑」完善信息');
}
function delPub(id) { if (!confirm('删除这篇论文？')) return; D.publications = D.publications.filter(p => p.id !== id); save(); renderPubs(); }
function movePub(idx, d) {
  const a = D.publications, t = a[idx].type;
  let j = idx + d;
  while (j >= 0 && j < a.length && a[j].type !== t) j += d;
  if (j < 0 || j >= a.length) return;
  [a[idx], a[j]] = [a[j], a[idx]]; save(); renderPubs();
}
function editPub(id) {
  const p = id ? D.publications.find(x => x.id === id) : { id: 'p' + Date.now().toString(36), type: 'journal', track: 'Artificial Intelligence', authors: '', title: '', venue: '', meta: '', year: new Date().getFullYear(), link: '', note: '' };
  const isNew = !id;
  window._pubImgPending = p.image || '';
  const trackSel = `
    <div class="field"><label>会议分类</label>
      <select id="fTrack">
        <option value="Artificial Intelligence" ${p.track === 'Artificial Intelligence' ? 'selected' : ''}>Artificial Intelligence</option>
        <option value="Optics and Photonics" ${p.track === 'Optics and Photonics' ? 'selected' : ''}>Optics and Photonics</option>
        <option value="Other" ${p.track && !['Artificial Intelligence', 'Optics and Photonics'].includes(p.track) ? 'selected' : ''}>Other</option>
      </select></div>`;
  openModal((isNew ? '新增论文' : '编辑论文') , `
    <div class="row2">
      <div class="field"><label>类型</label>
        <select id="fType" onchange="pubTypeChanged()">
          <option value="journal" ${p.type === 'journal' ? 'selected' : ''}>期刊论文</option>
          <option value="conf" ${p.type === 'conf' ? 'selected' : ''}>会议论文</option>
          <option value="patent" ${p.type === 'patent' ? 'selected' : ''}>专利</option>
        </select></div>
      <div class="field" id="trackWrap" style="display:${p.type === 'conf' ? '' : 'none'}">${trackSel}</div>
    </div>
    <div class="field"><label>作者（* 共同一作，# 通讯作者）</label><input type="text" id="fAuthors" value="${esc(p.authors)}"></div>
    <div class="field"><label>标题（必填）</label><input type="text" id="fTitle" value="${esc(p.title)}"></div>
    <div class="row2">
      <div class="field"><label id="venueLabel">期刊 / 会议名称</label><input type="text" id="fVenue" value="${esc(p.venue)}"></div>
      <div class="field"><label id="metaLabel">年卷期页</label><input type="text" id="fMeta" value="${esc(p.meta)}"></div>
    </div>
    <div class="row3">
      <div class="field"><label>年份（专利可留空）</label><input type="number" id="fYear" value="${p.year || ''}"></div>
      <div class="field" style="grid-column:span 2"><label>论文链接（直接粘贴）</label><input type="text" id="fLink" value="${esc(p.link)}" placeholder="https://doi.org/..."></div>
    </div>
    <div class="field"><label>备注（如 On the Cover / Highlight 等）</label><input type="text" id="fNote" value="${esc(p.note)}"></div>
    <div class="chk" style="margin-top:12px"><input type="checkbox" id="fFeatured" ${p.featured ? 'checked' : ''} onchange="document.getElementById('featFields').style.display=this.checked?'':'none'"> ⭐ 设为亮点展示（在 Publications 页顶部以图文卡片呈现）</div>
    <div id="featFields" style="display:${p.featured ? '' : 'none'};border:1px solid #eadfae;background:#fffdf3;border-radius:8px;padding:12px 14px;margin-top:10px">
      <div class="field"><label>创新点说明（中英文均可，显示在卡片上）</label><textarea id="fSummary" style="min-height:64px" placeholder="一句话说明这篇工作的核心创新点…">${esc(p.summary || '')}</textarea></div>
      <div class="field"><label>配图（可从论文链接自动抓取，或手动上传）</label>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <img id="fImgPrev" src="${esc(window._pubImgPending || p.image || '')}" onerror="this.style.display='none'" style="${(window._pubImgPending || p.image) ? 'max-height:90px;border-radius:6px;border:1px solid #dde4ec' : 'display:none'}">
          <span id="fImgEmpty" class="exp" style="display:${(window._pubImgPending || p.image) ? 'none' : ''}">暂无配图</span>
          <button type="button" onclick="pubImgUpload()">📤 上传图片</button>
          <button type="button" onclick="pubImgFetch('${esc(p.link)}')">🌐 从论文链接抓取</button>
          <button type="button" class="danger mini" onclick="pubImgClear()">移除配图</button>
        </div>
        <div class="exp" style="margin-top:5px">抓取原理：读取论文页面的 og:image 元数据；部分出版商（如 Wiley/Elsevier 部分页面）会屏蔽自动访问，失败时请手动上传截图。</div>
      </div>
      <div class="field"><label>补充链接（代码 / 数据集 / 项目主页等）</label>
        <div id="fExtraLinks">${(p.extraLinks || []).map(l => extraLinkRow(l)).join('')}</div>
        <button type="button" class="mini" onclick="addExtraLinkRow()">＋ 添加链接</button>
      </div>
    </div>
  `, () => {
    const g = i => document.getElementById(i).value.trim();
    p.type = g('fType'); p.authors = g('fAuthors'); p.title = g('fTitle');
    p.venue = g('fVenue'); p.meta = g('fMeta'); p.year = parseInt(g('fYear')) || 0;
    p.link = g('fLink'); p.note = g('fNote');
    p.featured = document.getElementById('fFeatured').checked;
    p.summary = g('fSummary');
    p.image = window._pubImgPending || '';
    p.extraLinks = Array.from(document.querySelectorAll('#fExtraLinks .exlink')).map(r => ({
      label: r.querySelector('.exlabel').value.trim(), url: r.querySelector('.exurl').value.trim()
    })).filter(l => l.url);
    if (p.type === 'conf') p.track = g('fTrack') === 'Other' ? 'Others' : g('fTrack');
    if (!p.title) { toast('标题必填'); return false; }
    if (isNew) D.publications.unshift(p);
    save(); renderPubs(); toast('已保存');
  });
}
function pubTypeChanged() {
  const t = document.getElementById('fType').value;
  document.getElementById('trackWrap').style.display = t === 'conf' ? '' : 'none';
  document.getElementById('venueLabel').textContent = t === 'patent' ? '国家 / 地区' : (t === 'conf' ? '会议名称' : '期刊名称');
  document.getElementById('metaLabel').textContent = t === 'patent' ? '专利号' : (t === 'conf' ? '会议地点' : '年卷期页');
}

/* ---------- 亮点展示：配图与补充链接 ---------- */
function extraLinkRow(l) {
  l = l || {};
  return `<div class="exlink" style="display:flex;gap:6px;margin:4px 0">
    <input class="exlabel" type="text" placeholder="名称(如 Code)" value="${esc(l.label || '')}" style="width:120px;padding:5px 8px;border:1px solid #ccd4de;border-radius:6px;flex-shrink:0">
    <input class="exurl" type="text" placeholder="https://github.com/..." value="${esc(l.url || '')}" style="flex:1;padding:5px 8px;border:1px solid #ccd4de;border-radius:6px">
    <button type="button" class="mini danger" onclick="this.parentNode.remove()">✕</button>
  </div>`;
}
function addExtraLinkRow() { document.getElementById('fExtraLinks').insertAdjacentHTML('beforeend', extraLinkRow({})); }
function showPubImg(src) {
  const img = document.getElementById('fImgPrev'), empty = document.getElementById('fImgEmpty');
  if (!img) return;
  if (src) { img.src = src; img.style.cssText = 'max-height:90px;border-radius:6px;border:1px solid #dde4ec'; img.onerror = ''; if (empty) empty.style.display = 'none'; }
  else { img.removeAttribute('src'); img.style.display = 'none'; if (empty) empty.style.display = ''; }
}
function pubImgUpload() {
  pickFile('image/*', async f => {
    try {
      window._pubImgPending = await uploadPhoto(f);
      showPubImg(window._pubImgPending);
      toast('配图已上传，保存弹窗后生效');
    } catch (e) { toast(e.message); }
  });
}
async function pubImgFetch(url) {
  url = (url || '').trim() || prompt('该论文没有填写链接，请输入要抓取的页面 URL：');
  if (!url) return;
  toast('正在抓取论文配图…');
  try {
    const r = await fetch('/api/fetchog', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
    const j = await r.json();
    if (j.ok) {
      window._pubImgPending = j.path;
      showPubImg(j.path);
      toast('✅ 已抓取配图，保存弹窗后生效');
    } else toast('抓取失败: ' + j.error);
  } catch (e) { toast('抓取失败: ' + e.message); }
}
function pubImgClear() { window._pubImgPending = ''; showPubImg(''); }
function toggleFeatured(id) {
  const p = D.publications.find(x => x.id === id);
  if (!p) return;
  p.featured = !p.featured;
  save(); renderPubs();
  toast(p.featured ? '⭐ 已设为亮点展示（可再点「编辑」补充分享图与创新点说明）' : '已取消亮点展示');
}

/* ================= 荣誉奖项 ================= */
function renderHonors() {
  const text = (D.honors || []).map(h => h.text).join('\n');
  document.getElementById('tab-honors').innerHTML = `
    <h2 class="sec">Honors and Awards</h2>
    <div class="hint">每行一条荣誉，顺序即显示顺序，可直接增删改行。</div>
    <div class="field"><textarea id="honorsBox" style="min-height:340px;line-height:2" oninput="honorsChanged(this.value)">${esc(text)}</textarea></div>`;
}
function honorsChanged(v) {
  D.honors = v.split('\n').map(s => s.trim()).filter(Boolean).map(t => ({ text: t }));
  save();
}

/* ================= 相关代码 ================= */
function renderCodes() {
  const rows = (D.codes || []).map((c, i) => `
    <div class="list-row">
      <div class="grow">
        <div class="row3">
          <div class="field" style="grid-column:span 2"><label>名称</label><input type="text" value="${esc(c.name)}" oninput="D.codes[${i}].name=this.value;save()"></div>
          <div class="field"><label>链接（可直接粘贴）</label><input type="text" value="${esc(c.url)}" placeholder="https://github.com/..." oninput="D.codes[${i}].url=this.value;save()"></div>
        </div>
        <div class="field"><label>说明（可选）</label><input type="text" value="${esc(c.desc)}" oninput="D.codes[${i}].desc=this.value;save()"></div>
      </div>
      <div class="ops">
        <button class="mini" onclick="moveCode(${i},-1)">↑</button>
        <button class="mini" onclick="moveCode(${i},1)">↓</button>
        <button class="mini danger" onclick="delCode(${i})">删除</button>
      </div>
    </div>`).join('');
  document.getElementById('tab-codes').innerHTML = `
    <h2 class="sec">Publication Related Codes <button class="mini primary" style="margin-left:8px" onclick="addCode()">＋ 添加</button></h2>
    ${rows || '<div class="hint">暂无，点击「添加」。</div>'}`;
}
function addCode() { D.codes = D.codes || []; D.codes.push({ name: '', url: '', desc: '' }); save(); renderCodes(); }
function delCode(i) { if (!confirm('删除这条代码链接？')) return; D.codes.splice(i, 1); save(); renderCodes(); }
function moveCode(i, d) { const a = D.codes, j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(); renderCodes(); }

/* ================= 发布导出 ================= */
let GH = { user: '', repo: '', branch: 'main', remember: true, hasToken: false };
let ghTokenSession = '';
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };

function renderPublish() {
  document.getElementById('tab-publish').innerHTML = `
    <h2 class="sec">生成静态网站（部署在本文件夹）</h2>
    <div class="hint">
      编辑器会把全部内容生成<b>多页面静态网站</b>并直接部署到 <b>C:\\个人课题组主页\\</b>
      （index.html、members.html、publications.html、honors.html、codes.html、members\\、photos\\）。
      该文件夹本身就是网站根目录，可直接作为 GitHub Pages 仓库发布。
    </div>
    <p style="margin:14px 0">
      <button class="primary" onclick="doExport()" style="padding:8px 22px;font-size:14px">🚀 生成 / 更新网站</button>
      ${MODE === 'server' ? '<button onclick="openSite()" style="margin-left:8px">本地预览</button>' : ''}
    </p>
    <div id="exportResult"></div>
    <h2 class="sec">一键发布到 GitHub Pages</h2>
    <div id="ghPanel"><div class="hint">加载中…</div></div>
    <h2 class="sec">数据管理</h2>
    <div class="kv">当前模式：<b>${MODE === 'server' ? '本地服务模式（数据保存到 data.json，支持 Word 解析、网站导出与 GitHub 发布）' : '浏览器本地模式（数据保存在浏览器 localStorage；Word 解析、网站导出与 GitHub 发布需启动本地服务）'}</b></div>
    <p>
      <button onclick="exportJSON()">导出数据为 JSON</button>
      <button onclick="importJSON()">从 JSON 导入</button>
      <button class="danger" onclick="resetData()">恢复初始内容</button>
    </p>
    <div class="hint" style="margin-top:14px">
      <b>使用方法：</b>双击本目录下的 <b>启动编辑器.bat</b> → 自动打开浏览器 → 编辑后自动保存 → 点「生成网站」部署到本文件夹，或点「一键发布到 GitHub」。
    </div>`;
  refreshGhPanel();
}
async function refreshGhPanel() {
  const el = document.getElementById('ghPanel');
  if (!el) return;
  if (MODE !== 'server') {
    el.innerHTML = '<div class="hint">⚠️ GitHub 发布需要本地服务支持：请双击「启动编辑器.bat」后使用。</div>';
    return;
  }
  try { const r = await fetch('/api/github/config'); GH = Object.assign({}, GH, await r.json()); } catch (e) {}
  const authed = GH.hasToken || ghTokenSession;
  el.innerHTML = `
    <div class="hint">第一次发布时，工具会<b>询问你是否进行账号授权</b>：授权通过 GitHub Personal Access Token 完成，仅用于创建仓库和推送网页，令牌只保存在本机（编辑器目录），不会上传或写入网站仓库。</div>
    <div class="row3">
      <div class="field"><label>GitHub 用户名</label><input type="text" id="ghUser" value="${esc(GH.user)}" placeholder="your-username"></div>
      <div class="field"><label>仓库名（留空则自动用 用户名.github.io）</label><input type="text" id="ghRepo" value="${esc(GH.repo)}" placeholder="${esc(GH.user || 'your-username')}.github.io"></div>
      <div class="field"><label>分支</label><input type="text" id="ghBranch" value="${esc(GH.branch || 'main')}"></div>
    </div>
    <div class="field" style="margin-top:10px;max-width:480px">
      <label>网络代理（可选；无法连接 GitHub 时填写，留空则自动探测本机代理）</label>
      <input type="text" id="ghProxy" value="${esc(GH.proxy || '')}" placeholder="http://127.0.0.1:7890">
    </div>
    <div class="chk" style="flex-wrap:wrap;gap:16px">
      <span><input type="checkbox" id="ghRemember" ${GH.remember ? 'checked' : ''}> 在本机记住授权令牌</span>
      <span><input type="checkbox" id="ghForce"> 远程历史不同则强制覆盖</span>
      ${authed ? '<span class="chip">✓ 已授权 ' + esc(GH.user || '') + '</span>' : '<span class="chip" style="background:#fff3df;color:#a4700a">未授权</span>'}
    </div>
    <p style="margin:14px 0">
      <button onclick="openGhAuth()">🔑 ${authed ? '更新授权' : '账号授权'}</button>
      <button class="primary" onclick="doGhPublish()" style="margin-left:8px">🚀 一键发布到 GitHub</button>
      ${GH.user ? `<button onclick="openGhSite()" style="margin-left:8px">打开线上主页</button>` : ''}
    </p>
    <div id="ghLog"></div>`;
}
function openGhAuth() {
  openModal('GitHub 账号授权', `
    <div class="hint">
      授权分三步：<br>
      1️⃣ 点击下方「打开令牌创建页」（已为你预选 <b>repo</b> 权限），登录 GitHub；<br>
      2️⃣ 拉到页面底部点 <b>Generate token</b>，复制生成的令牌（<b>ghp_</b> 开头，只显示一次）；<br>
      3️⃣ 粘贴到下方输入框，点「保存授权」。
    </div>
    <div class="field">
      <label>Personal Access Token</label>
      <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      <div class="exp" style="margin-top:5px">令牌仅保存在本机 site-editor/github_config.json（该文件已被排除在 git 仓库之外），不会上传到任何地方。</div>
    </div>
    <div class="mfoot" style="justify-content:flex-start">
      <button onclick="window.open('https://github.com/settings/tokens/new?scopes=repo&description=Homepage%20Editor','_blank')">打开令牌创建页 ↗</button>
    </div>
  `, async () => {
    const token = val('ghTokenInput');
    if (!token) { toast('请粘贴令牌'); return false; }
    ghTokenSession = token;
    const body = {
      user: val('ghUser'), repo: val('ghRepo'), branch: val('ghBranch') || 'main',
      token, remember: document.getElementById('ghRemember').checked
    };
    try {
      const r = await fetch('/api/github/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json();
      if (!j.ok) { toast('保存失败: ' + (j.error || '')); return false; }
      await refreshGhPanel();
      toast('✅ 授权已保存，现在可以一键发布了');
    } catch (e) { toast('保存失败: ' + e.message); return false; }
  });
}
async function doGhPublish() {
  if (MODE !== 'server') { toast('请先双击「启动编辑器.bat」启动本地服务'); return; }
  const user = val('ghUser');
  if (!user) { toast('请先填写 GitHub 用户名并授权'); openGhAuth(); return; }
  if (!ghTokenSession && !GH.hasToken) {
    if (confirm('发布到 GitHub 需要先进行一次账号授权（GitHub Personal Access Token）。\n\n是否现在开始授权？')) openGhAuth();
    return;
  }
  const repo = val('ghRepo') || (user + '.github.io');
  const logEl = document.getElementById('ghLog');
  logEl.innerHTML = '<div class="hint">⏳ 正在发布…（约需 10 秒 - 3 分钟；网络不佳时自动改用 API 直传）</div>';
  try {
    const r = await fetch('/api/github/publish', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, repo, branch: val('ghBranch') || 'main', force: document.getElementById('ghForce').checked, token: ghTokenSession || undefined, proxy: (val('ghProxy') || '').trim() || undefined })
    });
    const j = await r.json();
    logEl.innerHTML = j.ok
      ? `<div class="hint" style="background:#e8f6ec;border:1px solid #bfe3c8">✅ 发布成功！线上地址：<a href="${esc(j.url)}" target="_blank">${esc(j.url)}</a>（Pages 首次部署约 1-2 分钟生效）</div><div class="filelist">${(j.log || []).map(esc).join('<br>')}</div>`
      : `<div class="hint" style="background:#fdecea;border:1px solid #f0c4bd">❌ ${esc(j.error || '发布失败')}</div><div class="filelist">${(j.log || []).map(esc).join('<br>')}</div>`;
    if (j.ok) { GH.user = user; GH.repo = repo; refreshGhPanel(); }
  } catch (e) { logEl.innerHTML = ''; toast('发布失败: ' + e.message); }
}
function openGhSite() {
  const user = val('ghUser') || GH.user;
  if (!user) { toast('请先填写用户名'); return; }
  const repo = (val('ghRepo') || GH.repo || user + '.github.io').toLowerCase();
  window.open(repo === (user + '.github.io') ? `https://${user}.github.io/` : `https://${user}.github.io/${repo}/`);
}
async function doExport() {
  if (MODE !== 'server') { toast('浏览器本地模式不支持导出，请先双击「启动编辑器.bat」'); return; }
  await doSave();
  toast('正在生成网站…');
  try {
    const r = await fetch('/api/export');
    const j = await r.json();
    if (j.ok) {
      document.getElementById('exportResult').innerHTML =
        `<div class="hint" style="background:#e8f6ec;border:1px solid #bfe3c8">✅ 已生成 ${j.files.length} 个文件 → <b>${esc(j.dir)}</b></div>
         <div class="filelist">${j.files.map(esc).join('<br>')}</div>`;
      toast('✅ 网站已生成');
    } else toast('导出失败: ' + j.error);
  } catch (e) { toast('导出失败: ' + e.message); }
}
function openSite() {
  if (MODE === 'server') window.open('/site/index.html');
  else toast('请先双击「启动编辑器.bat」启动本地服务');
}

/* ---------- JSON 导入导出 / 重置 ---------- */
function exportJSON() {
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'homepage-data.json'; a.click();
  toast('已导出 JSON');
}
function importJSON() {
  pickFile('.json', async f => {
    try {
      const j = JSON.parse(await f.text());
      if (!j.profile) throw new Error('文件格式不正确');
      D = j; await doSave(); renderAll(); toast('✅ 数据已导入');
    } catch (e) { toast('导入失败: ' + e.message); }
  });
}
async function resetData() {
  if (!confirm('确定恢复为从原主页解析的初始内容？当前修改将丢失！')) return;
  D = JSON.parse(document.getElementById('default-data').textContent);
  await doSave(); renderAll(); toast('已恢复初始内容');
}

/* ---------- 弹窗 ---------- */
function openModal(title, bodyHtml, onSave) {
  const mask = document.getElementById('mask'), modal = document.getElementById('modal');
  modal.innerHTML = `<h3>${esc(title)}</h3>${bodyHtml}<div class="mfoot">
    <button onclick="closeModal()">取消</button>
    <button class="primary" id="modalOk">保存</button></div>`;
  mask.style.display = 'flex';
  document.getElementById('modalOk').onclick = () => { if (onSave() !== false) closeModal(); };
}
function closeModal() { document.getElementById('mask').style.display = 'none'; }
document.getElementById('mask').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

/* ---------- 启动 ---------- */
(async function init() {
  await load();
  renderAll();
})();
</script>
</body>
</html>
